# --- 5t · TUESDAY SALE CARD — struck by lightning, then it BLINKS ------------
# The one thing every real cart sign does that this one didn't: flash a price.
# flair.blink hard-blinks the text at 1 Hz (period 1000 ms, on 75 %); frame 0
# is always ON and the hold is stretched to end on an ON phase so the exit
# transition never leaves from a blank panel. Border + background stay lit
# through the OFF phase — only the letters blink. Short enough to hold still
# at 44 px (blink is a hold effect). Lightning strikes it in: the eldritch
# Tuesday deserves a bolt. Both shifts, Tuesday only.
