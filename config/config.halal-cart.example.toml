border = {style = "bands", colors = "candy_cane", band_width = 8, thickness = 2}

# --- 6t · TUESDAY crawls: the going-out-of-business pitch, possessed ----------
# PM: "FOR NOTHING REMAINS" — so the whole panel crumbles to SAND and the
# pitch pours back in grain by grain (flair.sand; a ticker section has one
# widget, so `entry_transition` is the only slot that fires here anyway).
[[playlist.section]]
mode = "ticker"
entry_transition = {type = "flair.sand", duration = 3.0}
schedule = {start = "11:00", end = "05:00", days = ["tue"]}

[[playlist.section.widget]]
type = "message"
text = "TACO TUESDAY MADNESS 🌮 TACOS • BURRITOS • BOWLS 🌮 PRICES SLASHED BY HANDS UNSEEN 🌮 EVERYTHING MUST GO, FOR NOTHING REMAINS 🌮 ONE DAY ONLY, AND YET ALL DAYS 🌮 DO NOT WALK, THE TIDE IS COMING 🌮 CASH ONLY"
font_color = "rainbow"
font = "Inter-Bold"
font_size = 44
border = {style = "bands", colors = "candy_cane", band_width = 8, thickness = 2}

[[playlist.section]]
mode = "ticker"
transition = {type = "flair.stickers", emoji = ["taco"], backing = "shadow"}
schedule = {start = "05:00", end = "11:00", days = ["tue"]}

[[playlist.section.widget]]
type = "message"
text = "TACO TUESDAY 🌙 BREAKFAST BURRITOS • FORETOLD • FOIL-WRAPPED 🌮 THESE PRICES CANNOT LAST 🌮 NOTHING DOES 🌮 EAT BEFORE THE DEEP TAKES US 🌮 CASH ONLY"
font_color = "rainbow"
font = "Inter-Bold"
font_size = 44
border = {style = "bands", colors = "candy_cane", band_width = 8, thickness = 2}
