# ===========================================================================
#  2 · THE GREETING — good morning / afternoon / night, live clock + temp
#      One always-on section; each widget carries its OWN schedule window so
#      exactly one greeting shows at any hour (windows cover the full day).
#      Clatters in on a Solari split-flap board (flair.splitflap — a clock
#      line deserves a departure board) over a twinkling starfield that
#      follows the time of day: gold at dawn, rainbow at noon, blue at night.
#      `background` is its own slot, so the stars sit UNDER the rainbow ring.
# ===========================================================================
[[playlist.section]]
mode = "slideshow"
hold_time = 8
# Every character flips through a few in-between glyphs before landing; the
# ripple runs left to right. Needs ~3 s to be watched, hence the override.
entry_transition = {type = "flair.splitflap.forward", duration = 3.0}

[[playlist.section.widget]]
type = "message"
text = "GOOD MORNING ☀️ :clock.now: • :wx.cart:"
schedule = {start = "05:00", end = "11:00"}
font_color = {style = "shimmer", base = "gold", shimmer = "white", speed = 18.0, pause = 0.5}
font = "Inter-Bold"
font_size = 44
border = {style = "rainbow", thickness = 2, speed = 4, char_offset = 6}
background = {style = "flair.twinkle", color = [255, 190, 0], density = 0.04, brightness = 0.5}

