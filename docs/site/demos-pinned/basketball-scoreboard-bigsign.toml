# render-duration: 36
# DEMO-mode basketball.scores horizontal arena board on a bigsign-shaped
# (256x64) panel: 36 px logos at the edges, the score beside each, the period
# over the clock in the centre. Same four fixture games as the longboi demo.
[display]
rows = 64
cols = 64
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "basketball.scores"
teams = ["PHI", "NY"]
demo = true
