# render-duration: 36
# DEMO-mode basketball.scores horizontal arena board on a long (512x64) panel.
# No network, no key, logos are bundled — demo = true renders four fixture
# games: a live 4th quarter in clutch time (its PHI win celebrates on the first
# turn), halftime, an OT final and the next scheduled game. Tracking PHI is what
# makes the win celebrate.
[display]
rows = 64
cols = 128
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "basketball.scores"
teams = ["PHI", "NY"]
demo = true
