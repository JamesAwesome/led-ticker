# render-duration: 40
# DEMO-mode football.scores held scoreboard on a bigsign-shaped (256x64) panel:
# two team rows with a dotted divider, the quarter / clock / down & distance in
# a right-hand column. Same five fixture games as the longboi demo.
[display]
rows = 64
cols = 64
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "football.scores"
teams = ["PHI", "NYG"]
demo = true
