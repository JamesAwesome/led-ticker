# render-duration: 27
# DEMO-mode hockey.scores held scoreboard on a long (512x64) panel. No network,
# no key — demo = true renders four fixture games: a live power play (whose
# goal celebrates on the first turn), a first intermission, an OT final and
# the next scheduled game. Tracking PHI is what makes the goal celebrate.
[display]
rows = 64
cols = 128
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "hockey.scores"
teams = ["PHI", "NYI"]
demo = true
