# render-duration: 27
# DEMO-mode hockey.scores on a smallsign (160x16, scale 1). `auto` resolves to
# the held two-band board here too (away on top, home below), rendered in the
# 5x8 bitmap font.
[display]
rows = 16
cols = 32
chain_length = 5
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "hockey.scores"
teams = ["PHI", "NYI"]
demo = true
