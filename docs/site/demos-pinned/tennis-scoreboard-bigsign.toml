# render-duration: 26
# DEMO-mode tennis.scores held scoreboard on a bigsign-shaped (256x64) panel.
# The narrower geometry compacts the numbers to sets-won, current-set games and
# the in-game points instead of one column per set.
[display]
rows = 64
cols = 64
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "tennis.scores"
demo = true
