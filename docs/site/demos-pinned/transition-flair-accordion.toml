# render-duration: 9
# requires-plugins: led-ticker-flair (with flair.accordion; render locally with the plugin installed)
[display]
rows = 64
cols = 256
chain_length = 1
default_scale = 4
brightness = 70

[transitions]
duration = 2.0
easing = "ease_in_out"

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.accordion.sweep"

[[playlist.section.widget]]
type = "message"
text = "FIREBIRD"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [255, 244, 214]

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.accordion.sweep"

[[playlist.section.widget]]
type = "message"
text = "YOGA"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [255, 183, 3]
