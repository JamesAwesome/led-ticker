# render-duration: 12
# requires-plugins: led-ticker-flair (>= 0.15.0; render locally with the plugin installed)
[display]
rows = 64
cols = 256
chain_length = 1
default_scale = 4
brightness = 70

[transitions]
duration = 2.5

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.laser.alternating"

[[playlist.section.widget]]
type = "message"
text = "LASER"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [255, 120, 40]

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.laser.alternating"

[[playlist.section.widget]]
type = "message"
text = "WRITE"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [80, 200, 255]
