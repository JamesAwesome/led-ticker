# render-duration: 10
# requires-plugins: led-ticker-flair (>= 0.21.0; render locally with the plugin installed)
[display]
rows = 64
cols = 256
chain_length = 1
default_scale = 4
brightness = 70

[transitions]
duration = 3.0

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.splitflap.forward"

[[playlist.section.widget]]
type = "message"
text = "VINYASA"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [255, 244, 214]

[[playlist.section]]
mode = "slideshow"
hold_time = 2.0
transition = "flair.splitflap.forward"

[[playlist.section.widget]]
type = "message"
text = "YIN YOGA"
center = true
font = "Inter-Bold"
font_size = 44
font_color = [255, 183, 3]
