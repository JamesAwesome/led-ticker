# render-duration: 8
# DEMO-mode weather.forecast on a bigsign-shaped (256x64) panel. Below the
# 400px threshold `auto` resolves to the "big" layout: a compact hero left of
# a dotted divider, with the day strip squeezed to the right of it.
[display]
rows = 64
cols = 64
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "weather.forecast"
demo = true
