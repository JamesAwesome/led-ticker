# render-duration: 8
# DEMO-mode weather.forecast on a longboi-shaped (512x64) panel with
# demo_days = 2 — what a FREE WeatherAPI key actually produces. The free tier
# returns 3 forecast days, and today is drawn as the hero, so only 2 day
# columns remain. The strip spreads them to fill rather than leaving a void.
[display]
rows = 64
cols = 128
chain_length = 4
default_scale = 4
brightness = 60

[[playlist.section]]
mode = "slideshow"
hold_time = 6

[[playlist.section.widget]]
type = "weather.forecast"
demo = true
demo_days = 2
