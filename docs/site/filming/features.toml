# Smallsign filming config — FEATURE CLIPS, one slate-delimited segment per effect.
# Deploy:  make film-deploy CONFIG=docs/site/filming/features.toml
# Record:  make film-record OUT=captures/features.mp4 SECONDS=<see README; two loops + anchors>
# Clip:    make film-clip IN=captures/features.mp4 MANIFEST=docs/site/filming/features.toml OUT=docs/site/public/filmed/
# Copy/palette: docs/DOCS-STYLE.md §6 (Firebird Yoga, phoenix palette). Only core + led-ticker-flair >= 0.24.
# The first slate is the 2.0 s loop anchor; every other slate is 1.0 s. Each
# `[[playlist.section]]  # film: <name>` line names the GIF cut from that section.

[display]
rows = 16
cols = 32
chain_length = 5
brightness = 60
gpio_slowdown = 2
hardware_mapping = "adafruit-hat"
hot_reload = true

[busy_light]
enabled = false

[title]
delay = 0

[transitions]
default = "cut"
duration = 0.5
easing = "ease_out"
between_sections = "cut"
transition_colors = [[255, 92, 38], [255, 183, 3], [99, 60, 138], [255, 244, 214]]

[[source]]
id = "clock.et"
type = "clock"
format = "%-I:%M %p"
timezone = "America/New_York"
color = [255, 183, 3]

[[playlist.section]]
mode = "slideshow"
bg_color = [255, 255, 255]
hold_time = 2.0
transition = "cut"

