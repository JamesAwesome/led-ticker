# Smallsign filming config — HERO loop (docs homepage / README / showcase).
# Deploy:  make film-deploy CONFIG=docs/site/filming/hero.toml
# Record:  make film-record OUT=captures/hero.mp4 SECONDS=90   (two loops + anchors)
# Clip:    make film-clip IN=captures/hero.mp4 MANIFEST=docs/site/filming/hero.toml OUT=docs/site/public/filmed/ MP4=hero HERO=hero
# Copy/palette: docs/DOCS-STYLE.md §6 (Firebird Yoga, phoenix palette). Only core + led-ticker-flair >= 0.24.
# The first section is the loop-anchor slate (2.0 s white); every content section cuts in and out.

[display]
rows = 16
cols = 32
chain_length = 5
brightness = 40
gpio_slowdown = 2
hardware_mapping = "adafruit-hat"
hot_reload = true

[busy_light]
enabled = false

# The status board must be on: `film deploy` waits on status.json to know the display is up.
[web]

[title]
delay = 0

[transitions]
default = "cut"
duration = 0.5
easing = "ease_out"
between_sections = "cut"
transition_colors = [[255, 92, 38], [255, 183, 3], [99, 60, 138], [255, 244, 214]]

[[source]]
id = "clock.et"
type = "clock"
format = "%-I:%M %p"
timezone = "America/New_York"
color = [255, 183, 3]

[[source]]
id = "clock.pt"
type = "clock"
format = "%-I:%M %p"
timezone = "America/Los_Angeles"
color = [255, 92, 38]

# --- slate (loop anchor: 2.0 s; inner slates in other configs are 1.0 s) ---
[[playlist.section]]
mode = "slideshow"
bg_color = [255, 255, 255]
hold_time = 2.0
transition = "cut"

[[playlist.section.widget]]
type = "message"
text = "."
font_color = [255, 255, 255]

# --- beats 1-3: typewriter + bulbs, countdown + bands, tagline over fireworks ---
[[playlist.section]]  # film: hero
mode = "slideshow"
hold_time = 3
widget_transition = {type = "flair.stickers", duration = 2.0, backing = "shadow", emoji = ["fire", "star", "heart", "sun"]}
transition_duration = 2.0

[[playlist.section.widget]]
type = "message"
text = "FIREBIRD YOGA"
font_color = {style = "color_cycle", from = [255, 183, 3], to = [214, 40, 57], speed = 3}
animation = {style = "typewriter", frames_per_char = 3}
border = {style = "lightbulbs", mode = "chase", lit_color = [255, 183, 3], unlit_color = [40, 15, 0], chase_density = 3}

[[playlist.section.widget]]
type = "countdown"
text = "Spring Sessions"
countdown_date = 2027-03-20
font_color = [255, 244, 214]
border = {style = "bands", colors = [[255, 92, 38], [255, 183, 3], [99, 60, 138], [214, 40, 57]], band_width = 8}

[[playlist.section.widget]]
type = "message"
text = "Breathe. Move. Rise."
font_color = {style = "gradient", from = [255, 183, 3], to = [214, 40, 57]}
background = {style = "flair.fireworks", bursts = 3, colors = [[255, 183, 3], [214, 40, 57], [255, 244, 214]]}

# --- beat 4 (nyancat in) + beat 5: two world-time cards, laser between ---
[[playlist.section]]
mode = "slideshow"
hold_time = 3
entry_transition = {type = "nyancat.alternating", duration = 2.5}
widget_transition = {type = "flair.laser.alternating", write_from = "opposite"}
transition_duration = 2.0

[[playlist.section.widget]]
type = "message"
text = ":red_apple: NEW YORK :clock.et: :sun:"
font_color = {style = "gradient", from = [255, 244, 214], to = [255, 92, 38]}

[[playlist.section.widget]]
type = "message"
text = ":star_yellow: LOS ANGELES :clock.pt: :moon:"
font_color = {style = "gradient", from = [255, 183, 3], to = [99, 60, 138]}

# --- beat 6: closing card (two_row: name over URL, both fit 160 px so it holds); the anchor slate cuts in after it ---
[[playlist.section]]
mode = "slideshow"
hold_time = 4
entry_transition = {type = "flair.splitflap.forward", duration = 2.5}

[[playlist.section.widget]]
type = "two_row"
top_text = "FIREBIRD YOGA"
bottom_text = "docs.ledticker.dev"
top_color = {style = "shimmer", base = [255, 183, 3], shimmer = [255, 244, 214], speed = 14, width = 8, pause = 0.5}
bottom_color = [255, 244, 214]
