# Smallsign filming config — YOUTUBE loop (3-5 min, the live sign's shape with public copy).
# Deploy:  make film-deploy CONFIG=docs/site/filming/youtube.toml
# Record:  make film-record OUT=captures/youtube.mp4 SECONDS=<two loops; see README>
# Clip:    make film-clip IN=captures/youtube.mp4 MANIFEST=docs/site/filming/youtube.toml OUT=captures/youtube-out/ MP4=youtube MP4_ONLY=1 FULL_FRAME=1
# Needs led-ticker-flair, led-ticker-weather (WEATHERAPI_KEY in .env), led-ticker-rss on the sign.
# Live data (weather, RSS) is fine here: this footage is a one-off upload, not re-filmable docs media.
# Sports section deliberately omitted (spec open question 4). One slate at the top only (loop anchor).
# Fall palette: harvest orange [255,110,0] · gold [255,190,40] · cranberry [200,30,70] · rust [190,75,15].

[display]
rows = 16
cols = 32
chain_length = 5
brightness = 40
gpio_slowdown = 2
hardware_mapping = "adafruit-hat"
hot_reload = true

[busy_light]
enabled = false

# The status board must be on: `film deploy` waits on status.json to know the display is up.
[web]

[title]
delay = 5

[transitions]
default = "push_left"
duration = 0.5
easing = "ease_out"
between_sections = {type = "nyancat.alternating", duration = 4.0}
transition_colors = [[255, 110, 0], [255, 190, 40], [200, 30, 70]]

[[source]]
id = "clock.et"
type = "clock"
format = "%-I:%M %p"
timezone = "America/New_York"
color = [255, 183, 3]

[[source]]
id = "clock.ct"
type = "clock"
format = "%-I:%M %p"
timezone = "America/Chicago"
color = [255, 92, 38]

[[source]]
id = "clock.mt"
type = "clock"
format = "%-I:%M %p"
timezone = "America/Denver"
color = [140, 220, 255]

[[source]]
id = "clock.pt"
type = "clock"
format = "%-I:%M %p"
timezone = "America/Los_Angeles"
color = [255, 120, 200]

[[source]]
id = "clock.utc"
type = "clock"
format = "%H:%M"
timezone = "UTC"
color = [0, 255, 70]

# --- slate (loop anchor) ---
[[playlist.section]]
mode = "slideshow"
bg_color = [255, 255, 255]
hold_time = 2.0
transition = "cut"
entry_transition = "cut"

[[playlist.section.widget]]
type = "message"
text = "."
font_color = [255, 255, 255]

# --- Fall greeting ---
[[playlist.section]]  # film: youtube
mode = "slideshow"
transition = "wipe_alternating"
entry_transition = {type = "flair.stickers", duration = 2.5, backing = "shadow", emoji = ["maple_leaf", "fallen_leaf", "acorn", "pumpkin", "turkey", "ear_of_corn", "red_apple", "mushroom"]}
hold_time = 6
loop_count = 1

[[playlist.section.widget]]
type = "message"
text = ":maple_leaf: HAPPY FALL :acorn:"
font_color = {style = "color_cycle", from = [255, 190, 40], to = [200, 30, 70], speed = 3}
animation = {style = "typewriter", frames_per_char = 3}
border = {style = "lightbulbs", mode = "chase", lit_color = [255, 190, 40], unlit_color = [40, 15, 0], chase_density = 3}

[[playlist.section.widget]]
type = "countdown"
text = "Thanksgiving"
countdown_date = 2026-11-26
font_color = [255, 110, 0]
border = {style = "bands", colors = [[255, 110, 0], [255, 190, 40], [200, 30, 70], [190, 75, 15]], band_width = 8}

[[playlist.section.widget]]
type = "message"
text = ":maple_leaf: HAPPY FALL Y'ALL :fallen_leaf: GOBBLE GOBBLE :turkey: PUMPKIN SPICE LATTE :hot_beverage: SWEATER WEATHER :pumpkin:"
font_color = {style = "gradient", from = [255, 190, 40], to = [200, 30, 70]}
border = {style = "bands", colors = [[255, 110, 0], [255, 190, 40], [200, 30, 70], [190, 75, 15]], band_width = 8}

